# Weekly database backup into the project's Vercel Blob store.
#
# Neon's free plan keeps a six-hour restore window. That covers a migration somebody
# regrets the same morning and nothing else: not a mistake found in April, not a
# provider closing an account, not a board deciding to leave. This takes a copy SAIP
# keeps itself.
#
# It writes to the same private Blob store as the attachments, under backups/, so the
# whole deployment stays inside one account with one bill of nothing.
#
# Two repository secrets are needed:
#   DATABASE_URL           the Neon connection string (the unpooled one is fine)
#   BLOB_READ_WRITE_TOKEN  from the project's Blob store
#
# Run it once by hand after setting them. A schedule nobody has ever watched succeed
# is not a backup. Then practise a restore, on purpose, while nothing is wrong.
name: Database backup

on:
  schedule:
    # 04:00 UTC every Sunday — the quietest hour for a board that works evenings.
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install a PostgreSQL client matching the server
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18

      - name: Dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret is not set"; exit 1; }
          stamp=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          echo "stamp=$stamp" >> "$GITHUB_ENV"
          # Custom format: compressed, and restorable table by table.
          pg_dump --format=custom --no-owner --no-privileges \
            --file="saip-$stamp.dump" "$DATABASE_URL"
          ls -lh "saip-$stamp.dump"

      - name: Refuse to upload an implausibly small dump
        run: |
          size=$(stat -c%s "saip-${{ env.stamp }}.dump")
          echo "dump is $size bytes"
          # A real dump of this schema is tens of kilobytes even with no records in it.
          # Uploading a truncated one over a good backup is worse than failing loudly.
          test "$size" -gt 20000 || { echo "Too small to be a real dump; not uploading."; exit 1; }

      - name: Upload to the Blob store, and keep the last twelve
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          STAMP: ${{ env.stamp }}
        run: |
          test -n "$BLOB_READ_WRITE_TOKEN" || { echo "BLOB_READ_WRITE_TOKEN is not set"; exit 1; }
          npm install --no-save @vercel/blob@2.9.0 > /dev/null
          node --input-type=module <<'JS'
          import { readFile } from "node:fs/promises";
          import { put, list, del } from "@vercel/blob";

          const stamp = process.env.STAMP;
          const name = `backups/saip-${stamp}.dump`;
          const bytes = await readFile(`saip-${stamp}.dump`);

          await put(name, bytes, {
            access: "private",
            addRandomSuffix: false,
            contentType: "application/octet-stream",
          });
          console.log(`uploaded ${name} (${bytes.length} bytes)`);

          // Retention. Sorted by pathname, which sorts by date because the stamp is
          // ISO-8601 — the one good reason to put a timestamp in a filename.
          const { blobs } = await list({ prefix: "backups/" });
          const dumps = blobs
            .filter((b) => b.pathname.endsWith(".dump"))
            .sort((a, b) => a.pathname.localeCompare(b.pathname));

          const stale = dumps.slice(0, Math.max(0, dumps.length - 12));
          for (const old of stale) {
            await del(old.url);
            console.log(`removed ${old.pathname}`);
          }
          console.log(`${dumps.length - stale.length} backups kept`);
          JS

      - name: Say what happened
        run: |
          {
            echo "### Backup taken"
            echo
            echo "\`backups/saip-${{ env.stamp }}.dump\` is in the Blob store."
            echo
            echo "Restore into a fresh Neon branch with:"
            echo '```'
            echo 'pg_restore --clean --no-owner -d "$TARGET_URL" saip-….dump'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
